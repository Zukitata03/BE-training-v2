name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
      redis:
        image: bitnami/redis:latest
        env:
          REDIS_PASSWORD: pw
        ports:
          - 6379:6379

    defaults:
      run:
        working-directory: TrainingAPI

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest tests/ -v
        env:
          MONGO_CONNECTION_URL: mongodb://127.0.0.1:27017/
          MONGO_DATABASE: example_db
          REDIS_HOST: 127.0.0.1
          REDIS_PASSWORD: pw
          SECRET_KEY: ci-not-secret